l_spanish:

  hold_ecumenical_council_decision:0 "Convocar el Gran Concilio Ecuménico"
  hold_ecumenical_council_decision_desc:0 "Convoca a los obispos y patriarcas de la cristiandad para reconciliar la doctrina y establecer una nueva Iglesia universal."
  hold_ecumenical_council_decision_tooltip:0 "Unir a la cristiandad bajo una única fe universal."
  hold_ecumenical_council_decision_confirm:0 "¡Ha llegado la hora de la unidad!"
  hold_ecumenical_council_decision_effect_tooltip:0 "Las diversas fes cristianas se reunirán en un concilio dedicado a poner fin a los cismas que dividen la cristiandad."

  establish_new_church_leader_decision:0 "Establecer la Sede Apostólica"
  establish_new_church_leader_decision_desc:0 "La Iglesia universal está unida, pero carece de un pastor que guíe a los fieles y salvaguarde la doctrina. Por derecho divino y con la autoridad del Concilio, podemos ahora restaurar la Sede Apostólica y nombrar a su primer Apóstol."
  establish_new_church_leader_decision_tooltip:0 "Convocar a los delegados restantes del Concilio para nombrar un líder espiritual para la Iglesia universal."
  establish_new_church_leader_decision_confirm:0 "Restaurar la Sede Apostólica."
  establish_new_church_leader_decision_effect_tooltip:0 "Encontrar un pastor digno para el rebaño recién reunificado de la cristiandad."

  create_universal_holy_order_decision:0 "Fundar una orden sagrada universal"
  create_universal_holy_order_decision_desc:0 "La obstinación de las antiguas órdenes sagradas las ha extraviado, así que debemos fundar una nueva orden sagrada para defender nuestra fe."
  create_universal_holy_order_decision_confirm:0 "¡Por la defensa de la fe y de los fieles!"
  create_universal_holy_order_decision_tooltip:0 "Crear una nueva orden sagrada para defender la fe unificada."
  create_universal_holy_order_decision_effect_message:0 "Con los subsidios de los fieles y el apoyo de la Sede Apostólica, se fundará una [holy_order|lE] de tu [faith|lE] por mucho menos de lo habitual\n$EFFECT_LIST_BULLET$Te conviertes en [holy_order_patron|lE] de la orden.\n$EFFECT_LIST_BULLET$Seleccionarás una [barony|lE] que no sea la [capital|lE] de un [county|lE] como cuartel general de la orden."

  ecumenical_council.0200.t:0 "Concluye el Gran Concilio Ecuménico"
  ecumenical_council.0200.desc:0 "Las cinco antiguas sedes han sido reclamadas por la cristiandad en general. Los emperadores de Oriente y Occidente dan su bendición, y los jefes de las antiguas iglesias se han reunido en asamblea. Tras meses de debate, se proclama la Iglesia universal."
  ecumenical_council.0200.a:0 "¡Que nazca la Iglesia universal!"
  ecumenical_council.0200.a.tt:0 "Se funda la Iglesia [GetFaithByKey('universal_church').GetAdjective] y se invita a toda la cristiandad a unirse."

  ecumenical_council.0201.t:0 "Una nueva fe universal"
  ecumenical_council.0201.desc:0 "El gran concilio ha reconciliado las antiguas divisiones de la cristiandad. Quienes siempre han buscado la unidad ven ahora su sueño hecho realidad. Se te invita a abrazar la Iglesia [GetFaithByKey('universal_church').GetAdjective]."
  ecumenical_council.0201.a:0 "Me uniré a esta nueva Iglesia universal."
  ecumenical_council.0201.b:0 "Mis creencias no se ven alteradas por esta farsa."

  ecumenical_council.0202.t:0 "¿Una nueva fe universal?"
  ecumenical_council.0202.desc:0 "Un gran concilio afirma haber unido a la cristiandad bajo un solo credo. Los decretos suenan ajenos a tus tradiciones. ¿Aceptarás esta Iglesia universal como la verdadera heredera de la fe?"
  ecumenical_council.0202.a:0 "Verdaderamente, esto solo puede ser obra de Jesucristo."
  ecumenical_council.0202.b:0 "Los necios están unidos en el error."

  ecumenical_council.0203.t:0 "Los cristianos proclaman la unidad"
  ecumenical_council.0203.desc:0 "En todas las tierras de los cristianos, un gran concilio ha declarado una nueva Iglesia universal. Los sacerdotes hablan de unidad y renovación; de otro poder que surge en occidente."
  ecumenical_council.0203.a:0 "¡Bah! Una afirmación audaz, destinada al fracaso."

  ecumenical_papacy_approval:0 "[GetTitleByKey('k_papal_state').GetHolder.GetTitledFirstName] debe tener al menos #V 75#! de [opinion|E] sobre ti (#V 100#! si [GetTitleByKey('k_papal_state').GetHolder.GetTitledFirstName] es [GetTrait('zealous').GetName(GetNullCharacter)])."

  ecumenical_orthodox_approval:0 "[GetTitleByKey('k_orthodox').GetHolder.GetTitledFirstName] debe tener al menos #V 75#! de [opinion|E] sobre ti (#V 100#! si [GetTitleByKey('k_orthodox').GetHolder.GetTitledFirstName] es [GetTrait('zealous').GetName(GetNullCharacter)])."

  ecumenical_coptic_approval:0 "[GetTitleByKey('d_coptic_papacy').GetHolder.GetTitledFirstName] debe tener al menos #V 75#! de [opinion|E] sobre ti (#V 100#! si [GetTitleByKey('d_coptic_papacy').GetHolder.GetTitledFirstName] es [GetTrait('zealous').GetName(GetNullCharacter)])."

  ecumenical_council_rome_doctrine:0 "[GetTitleByKey('c_roma').GetName] debe estar en manos de un gobernante cuya fe tenga la doctrina [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName]."
  ecumenical_council_constantinople_doctrine:0 "[GetTitleByKey('c_byzantion').GetName] debe estar en manos de un gobernante cuya fe tenga la doctrina [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName]."
  ecumenical_council_jerusalem_doctrine:0 "[GetTitleByKey('c_jerusalem').GetName] debe estar en manos de un gobernante cuya fe tenga la doctrina [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName]."
  ecumenical_council_alexandria_doctrine:0 "[GetTitleByKey('c_alexandria').GetName] debe estar en manos de un gobernante cuya fe tenga la doctrina [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName]."
  ecumenical_council_antioch_doctrine:0 "[GetTitleByKey('c_antiocheia').GetName] debe estar en manos de un gobernante cuya fe tenga la doctrina [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName]."

  fervor_gain_mended_schism_ecumenical:0 "El Gran Concilio Ecuménico ha reparado el Cisma de Oriente y Occidente y ha unido a la cristiandad."
  fervor_loss_mended_schism_ecumenical:0 "Resistentes a la unificación de la cristiandad."
  fervor_gain_new_apostle:0 "Un nuevo pastor de la Iglesia ha sido ungido."

  # 0001 - Opening of the Council
  ecumenical_council.0001.t:0 "El Gran Concilio se reúne"
  ecumenical_council.0001.desc:0 "Obispos, abades, patriarcas y teólogos de toda la cristiandad se han reunido bajo un mismo techo en Jerusalén. El aire vibra con tensión y esperanza. Pronto, la Iglesia volverá a hablar con una sola voz, si es que logramos ponernos de acuerdo sobre lo que dirá esa voz."
  ecumenical_council.0001.a:0 "«Porque donde están dos o tres congregados en mi nombre...» - Mateo 18:20"

  # 0100 - Debate 1: Religious Attitude
  ecumenical_council.0100.t:0 "La cuestión del extraño"
  ecumenical_council.0100.desc:0 "Nuestra propia fe estará unida, pero en todo el mundo hay innumerables almas que no siguen a Cristo. El concilio debe decidir: ¿cómo consideraremos a aquellos que aún no lo conocen?"
  ecumenical_council.0100.a:0 "«El que no está conmigo, está contra mí». - Mateo 12:30"
  ecumenical_council.0100.b:0 "«Perdónalos, porque no saben lo que hacen». - Lucas 23:34"
  ecumenical_council.0100.b.tt:0 "La [GetFaithByKey('universal_church').GetName] conservará la doctrina [GetFaithDoctrine('doctrine_pluralism_righteous').GetBaseName]."
  ecumenical_council.0100.c:0 "«En la casa de mi Padre hay muchas moradas». - Juan 14:2"

  # 0101 - Ecumenism
  ecumenical_council.0101.t:0 "La cuestión de los desafiantes"
  ecumenical_council.0101.desc:0 "Aquellos que una vez fueron llamados hermanos ahora rechazan la unidad de la Iglesia. ¿Borraremos sus nombres de las listas o les extenderemos la gracia?"
  ecumenical_council.0101.a:0 "«Porque tales hombres son falsos apóstoles...» - 2 Corintios 11:13"
  ecumenical_council.0101.b:0 "«Dejad que ambos crezcan juntos hasta la siega». - Mateo 13:30"
  ecumenical_council.0101.b.tt:0 "La [GetFaithByKey('universal_church').GetName] conservará la doctrina [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName]."

  # 0102 - Divorce
  ecumenical_council.0102.t:0 "La cuestión del divorcio"
  ecumenical_council.0102.desc:0 "Moisés permitió el divorcio por la dureza del corazón. Jesús lo prohibió, excepto en caso de adulterio. Hay beneficios prácticos. ¿Qué haremos con el divorcio?"
  ecumenical_council.0102.a:0 "«Lo que Dios ha unido, que no lo separe el hombre». - Marcos 10:9"
  ecumenical_council.0102.b:0 "«Moisés permitió escribir una carta de divorcio». - Marcos 10:4"

  # 0103 - Bastardization
  ecumenical_council.0103.t:0 "La cuestión de la ilegitimidad"
  ecumenical_council.0103.desc:0 "Muchos gobernantes ungidos han engendrado hijos ilegítimos fuera del matrimonio. ¿Se les prohibirá a los hijos de estas uniones ilícitas la herencia y el honor, o perdonaremos los pecados de sus padres?"
  ecumenical_council.0103.a:0 "«El hijo no cargará con la iniquidad del padre». - Ezequiel 18:20"
  ecumenical_council.0103.b:0 "«Ningún bastardo entrará en la congregación del SEÑOR». - Deuteronomio 23:2"

  # 0104 - Consanguinity
  ecumenical_council.0104.t:0 "La cuestión del parentesco"
  ecumenical_council.0104.desc:0 "¿Dónde se convierte el parentesco santo en unión prohibida? Los nobles presionan por excepciones; la ley exige límites."
  ecumenical_council.0104.a:0 "«Ninguno de ustedes se acercará a nadie que sea pariente cercano». - Levítico 18:6"
  ecumenical_council.0104.b:0 "«No es bueno que el hombre esté solo». - Génesis 2:18"
  ecumenical_council.0104.c:0 "«El amor cubrirá todas las faltas». - Proverbios 10:12"

  # 0105 - Adultery
  ecumenical_council.0105.t:0 "La cuestión del adulterio"
  ecumenical_council.0105.desc:0 "El concilio se ocupa ahora de los asuntos de adulterio. Algunos argumentan que hombres y mujeres deben enfrentar las mismas consecuencias por el adulterio, mientras que otros piden un trato diferenciado. ¿Cómo definirá la Iglesia el pecado y la justicia en este asunto?"
  ecumenical_council.0105.a:0 "«Cualquiera que mira a una mujer para codiciarla... ya adulteró» - Mateo 5:28"
  ecumenical_council.0105.b:0 "«El que de vosotros esté sin pecado sea el primero en arrojar la piedra». - Juan 8:7"
  ecumenical_council.0105.c:0 "«No juzguéis, para que no seáis juzgados». - Mateo 7:1"

  # 0106 - Priest Function
  ecumenical_council.0106.t:0 "La cuestión de los sacerdotes"
  ecumenical_council.0106.desc:0 "El papel del clero pasa a primer plano en la discusión. ¿Deberían los sacerdotes recaudar diezmos y administrar la riqueza? ¿O dedicarse a la limosna y la guía entre los fieles?"
  ecumenical_council.0106.a:0 "«Dad, pues, al César lo que es del César, y a Dios lo que es de Dios». - Mateo 22:21"
  ecumenical_council.0106.b:0 "«Bienaventurados los pacificadores». - Mateo 5:9"

  # 0107 - Clerical Marriage
  ecumenical_council.0107.t:0 "La cuestión del celibato"
  ecumenical_council.0107.desc:0 "Pablo advirtió que el matrimonio podría obstaculizar la obra que uno hace para el Señor, pero la Escritura también dice que el matrimonio es honorable. ¿Deberían aquellos que ministran a Dios estar obligados al celibato, o pueden los sacerdotes casarse y servir tanto al altar como al hogar?"
  ecumenical_council.0107.a:0 "«Bueno le sería al hombre no tocar mujer». - 1 Corintios 7:1"
  ecumenical_council.0107.b:0 "«El que halla esposa halla el bien». - Proverbios 18:22"

  # 0108 - Spreading the Faith
  ecumenical_council.0108.t:0 "La cuestión del evangelismo"
  ecumenical_council.0108.desc:0 "Nuestra primera gran orden del día es decidir cómo difundiremos nuestra fe a las naciones. Algunos abogan por continuar la obra de la espada, argumentando que nuestro éxito en la recuperación de Tierra Santa demuestra su santidad ante Dios. Otros dicen que debemos deponer las armas y volver a difundir la fe por el camino de los Apóstoles."
  ecumenical_council.0108.a:0 "«No llevéis nada para el camino, sino solamente bastón». - Marcos 6:8"
  ecumenical_council.0108.b:0 "«No he venido a traer paz, sino espada». - Mateo 10:34"

  # 0109 - Unity in the Faith
  ecumenical_council.0109.t:0 "La naturaleza de la verdadera unidad"
  ecumenical_council.0109.desc:0 "A medida que el debate se acerca a su fin en las salas del concilio, surgen dos visiones para mantener la unidad recién conquistada de la Iglesia. Algunos sostienen que la comprensión y la instrucción unificarán a los creyentes. Otros afirman que la certeza y la resolución son los verdaderos pilares comunes de la fe. ¿Provendrá nuestra cacareada unidad de la razón compartida? ¿O de la convicción compartida?"
  ecumenical_council.0109.a:0 "«Venid ahora, y razonemos juntos, dice el Señor». - Isaías 1:18"
  ecumenical_council.0109.b:0 "«Estad alerta; permaneced firmes en la fe; sed valientes; sed fuertes». - 1 Corintios 16:13"

  # 0300 - A new leader of the faith
  ecumenical_council.0300.t:0 "Un pastor para la Iglesia universal"
  ecumenical_council.0300.desc:0 "La obra del Concilio está casi completada, pero queda un asunto pendiente. ¿Quién guiará esta naciente Iglesia universal? Los fieles están unidos en la doctrina, pero la unidad exige un pastor que la proteja.\n\n«Apacienta mis ovejas», le dijo el Señor a Pedro. Así también nosotros debemos encontrar ahora a alguien apto para llevar esa carga."
  ecumenical_council.0300.a:0 "Que el Señor esté con él mientras guía al rebaño."

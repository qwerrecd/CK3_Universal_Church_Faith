l_english:

  hold_ecumenical_council_decision:0 "Convene the Great Ecumenical Council"
  hold_ecumenical_council_decision_desc:0 "Summon the bishops and patriarchs of Christendom to reconcile doctrine and establish a new Universal Church."
  hold_ecumenical_council_decision_tooltip:0 "Unite Christendom under a single, universal faith."
  hold_ecumenical_council_decision_confirm:0 "The time for unity is now!"
  hold_ecumenical_council_decision_effect_tooltip:0 "The disparate Christian faiths will come together for a council dedicated to ending the schisms dividing Christendom."

  ecumenical_council.0001.t:0 "The Great Ecumenical Council Convenes"
  ecumenical_council.0001.desc:0 "The five ancient sees stand reclaimed by wider Christendom. The emperors of East and West lend their blessing, and the heads of the ancient churches gather in assembly. After months of debate, the Universal Church is proclaimed."
  ecumenical_council.0001.a:0 "Let the Universal Church be born!"
  ecumenical_council.0001.a.tt:0 "The [GetFaithByKey('universal_church').GetAdjective] Church is founded, and all of Christendom is invited to join."

  ecumenical_council.0002.t:0 "A New Universal Faith"
  ecumenical_council.0002.desc:0 "The great council has reconciled the ancient divides of Christendom. Those who have always sought unity now see their dream realized. You are invited to embrace the [GetFaithByKey('universal_church').GetAdjective] Church."
  ecumenical_council.0002.a:0 "I shall join this new Universal Church."
  ecumenical_council.0002.b:0 "My beliefs are unshaken by this posturing."

  ecumenical_council.0003.t:0 "A New Universal Faith?"
  ecumenical_council.0003.desc:0 "A grand council claims to have united Christendom under one creed. The decrees sound foreign to your traditions. Will you accept this Universal Church as the true heir of the faith?"
  ecumenical_council.0003.a:0 "Truly this can only be the work of Jesus Christ."
  ecumenical_council.0003.b:0 "The fools are united in error."

  ecumenical_council.0004.t:0 "The Christians Claim Unity"
  ecumenical_council.0004.desc:0 "Across the lands of the Christians, a great council has declared a new Universal Church. The priests speak of unity and renewal; of another power rising in the west."
  ecumenical_council.0004.a:0 "Bah! A bold claim, sure to falter."

  ecumenical_papacy_approval:0 "[GetTitleByKey('k_papal_state').GetHolder.GetTitledFirstName] must have at least #V 75#! [opinion|E] of you (#V 100#! if [GetTitleByKey('k_papal_state').GetHolder.GetTitledFirstName] is [GetTrait('zealous').GetName(GetNullCharacter)])."

  ecumenical_orthodox_approval:0 "[GetTitleByKey('k_orthodox').GetHolder.GetTitledFirstName] must have at least #V 75#! [opinion|E] of you (#V 100#! if [GetTitleByKey('k_orthodox').GetHolder.GetTitledFirstName] is [GetTrait('zealous').GetName(GetNullCharacter)])."

  ecumenical_coptic_approval:0 "[GetTitleByKey('d_coptic_papacy').GetHolder.GetTitledFirstName] must have at least #V 75#! [opinion|E] of you (#V 100#! if [GetTitleByKey('d_coptic_papacy').GetHolder.GetTitledFirstName] is [GetTrait('zealous').GetName(GetNullCharacter)])."

  ecumenical_council_rome_doctrine:0 "[GetTitleByKey('c_roma').GetName] must be held by a ruler whose faith has the [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName] Doctrine."

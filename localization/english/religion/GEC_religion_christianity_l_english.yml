l_english:

 #Unified Church Localization
 unified_church:0 "Unified Christianity"
 unified_church_adj:0 "Unified Christian"
 unified_church_adherent:0 "Christian"
 unified_church_adherent_plural:0 "Christians"
 unified_church_desc:0 "An ecumenical revival of the unified church at the time of Jesus, the Unified Church seeks to bring together all Christians; emphasizing shared beliefs, resolving doctrinal differences, and promoting unity and communion under Jesus above all else."
 unified_church_religious_head_title:0 "Apostle"
 unified_church_religious_head_title_name:0 "Apostleship"

 # alternate names
 unified_church_catholic:0 "Unified Catholicism"
 unified_church_catholic_adj:0 "Unified Catholic"
 unified_church_catholic_adherent:0 "Christian"
 unified_church_catholic_adherent_plural:0 "Christians"
 unified_church_catholic_desc:0 "Born from a Great Council in the Holy Land, the Holy Church of Christ represents a vision of restored unity among Christians. Rooted in the Catholic tradition yet embracing reconciliation with all branches of the faith, it calls believers to lay aside past divisions and stand together in shared creed, sacrament, and devotion to Christ."
 unified_church_catholic_religious_head_title:0 "Apostle"
 unified_church_catholic_religious_head_title_name:0 "Apostleship"

 unified_church_orthodox:0 "Unified Orthodoxy"
 unified_church_orthodox_adj:0 "Unified Orthodox"
 unified_church_orthodox_adherent:0 "Christian"
 unified_church_orthodox_adherent_plural:0 "Christians"
 unified_church_orthodox_desc:0 "Arising from a Great Council dedicated to restoring communion among believers, the Union of the Faithful emphasizes shared apostolic faith and the balance of scripture, tradition, and council. It preserves the spiritual depth and liturgical heritage of Orthodoxy while welcoming all Christians into renewed unity under Christ."
 unified_church_orthodox_religious_head_title:0 "Apostle"
 unified_church_orthodox_religious_head_title_name:0 "Apostleship"

 unified_church_coptic:0 "Unified Coptic Christianity"
 unified_church_coptic_adj:0 "Unified Coptic"
 unified_church_coptic_adherent:0 "Christian"
 unified_church_coptic_adherent_plural:0 "Christians"
 unified_church_coptic_desc:0 "Drawing from the Alexandrian heritage and the wisdom of the desert fathers, the Church of the Living Word seeks to heal divisions through humility and shared devotion. It calls all Christians to rediscover unity through the life-giving Word of God and the grace of the Holy Spirit."
 unified_church_coptic_religious_head_title:0 "Apostle"
 unified_church_coptic_religious_head_title_name:0 "Apostleship"

 unified_church_apostolic:0 "Unified Apostolic Christianity"
 unified_church_apostolic_adj:0 "Apostolic Christian"
 unified_church_apostolic_adherent:0 "Christian"
 unified_church_apostolic_adherent_plural:0 "Christians"
 unified_church_apostolic_desc:0 "Rooted in the ancient apostolic faith, the Apostolic Communion unites the diverse churches of Christendom under the shared lineage of the apostles. It honors the witness of the martyrs and the unity of the early Church, blending the traditions of East and West into one body of believers."
 unified_church_apostolic_religious_head_title:0 "Apostle"
 unified_church_apostolic_religious_head_title_name:0 "Apostleship"

 #Abrahamic Tenets

 tenet_unified_catechism_name:0 "Unified Catechism"
 tenet_unified_catechism_desc:0 "The truth of God is one, but men stumble in darkness without guidance. By teaching, studying, and reasoning together, the Church shall bring all souls into understanding. Sound doctrine and careful study are lights to our path."

 tenet_faith_triumphant_name:0 "Faith Triumphant"
 tenet_faith_triumphant_desc:0 "Understanding is a virtue, but conviction is salvation. The faithful do not question endlessly. They stand firm in the truth once revealed. The Church shall not waver, for faith unyielding is faith unbroken."
 
